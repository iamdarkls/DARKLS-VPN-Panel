name: Full validation
on:
  workflow_call:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: false
      - run: python3 tools/build_assets.py --check
      - run: go test -race ./...
      - run: go vet ./...
      - run: python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Validate router scripts
        run: |
          for script in router/*.sh release/*.sh; do sh -n "$script"; done
      - name: Cache npm and Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.npm
            ~/.cache/ms-playwright
          key: browser-${{ runner.os }}-${{ hashFiles('tools/browser/package-lock.json') }}
      - name: Install pinned browser tools
        timeout-minutes: 5
        run: sh tools/ci_retry.sh npm ci --prefix tools/browser --ignore-scripts --no-audit --no-fund
      - name: Install browser and network test dependencies
        timeout-minutes: 8
        run: |
          sh tools/ci_retry.sh tools/browser/node_modules/.bin/playwright install-deps chromium
          sh tools/ci_retry.sh sudo apt-get install -y --no-install-recommends iptables iproute2
      - name: Install Chromium
        timeout-minutes: 8
        run: sh tools/ci_retry.sh tools/browser/node_modules/.bin/playwright install chromium
      - name: Browser scenarios
        env:
          NODE_PATH: ${{ github.workspace }}/tools/browser/node_modules
        run: |
          export CHROME_PATH="$(node -p 'require("playwright").chromium.executablePath()')"
          python3 tests/integration/run_browser.py
      - name: Build native update pair
        run: |
          BASELINE_REF=$(git describe --tags --match 'v[0-9]*' --abbrev=0 HEAD^ 2>/dev/null || git rev-parse HEAD^)
          git worktree add --detach /tmp/darkls-baseline "$BASELINE_REF"
          (cd /tmp/darkls-baseline && go build -o /tmp/darkls-baseline-bin ./cmd/darkls-panel)
          go build -o /tmp/darkls-current-bin ./cmd/darkls-panel
      - name: Installer rollback and authenticated OTA
        env:
          DARKLS_BASELINE_BINARY: /tmp/darkls-baseline-bin
          DARKLS_CURRENT_BINARY: /tmp/darkls-current-bin
        run: |
          sudo --preserve-env=DARKLS_BASELINE_BINARY,DARKLS_CURRENT_BINARY python3 tests/integration/test_installer.py
          sudo --preserve-env=DARKLS_BASELINE_BINARY,DARKLS_CURRENT_BINARY python3 tests/integration/test_ota.py
          sudo --preserve-env=DARKLS_BASELINE_BINARY,DARKLS_CURRENT_BINARY python3 tests/integration/test_recovery_mode.py
      - name: Three clients through Linux NAT and DNS
        run: sudo python3 tests/integration/test_network.py
      - name: Shell supervisor crash recovery
        run: python3 tests/integration/test_supervisor.py
