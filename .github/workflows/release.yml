name: Publish signed panel release
on:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: signed-panel-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false
      - name: Validate release version
        id: version
        run: |
          RELEASE_VERSION=$(python3 -c 'import pathlib,re; v=pathlib.Path("release-version.txt").read_text().strip(); assert re.fullmatch(r"\d{1,4}\.\d{1,4}\.\d{1,4}",v); print(v)')
          echo "tag=v$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          RELEASE_CHANNEL=$(python3 -c 'import pathlib; v=pathlib.Path("release-channel.txt").read_text().strip(); assert v in ("stable","preview"); print(v)')
          echo "channel=$RELEASE_CHANNEL" >> "$GITHUB_OUTPUT"
      - name: Download exact tested package from this workflow run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --name "tested-panel-$GITHUB_SHA" --dir dist
      - name: Verify tested commit, tree, run, channel and archive checksum
        run: python3 tools/tested_package.py verify
      - name: Prepare release changelog
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: python3 tools/release_notes.py --version "${RELEASE_TAG#v}" --output dist/release-notes.md
      - name: Sign release metadata
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          PANEL_RELEASE_CHANNEL: ${{ steps.version.outputs.channel }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: go run ./tools/releasekey -mode sign -version "${RELEASE_TAG#v}" -archive "dist/DARKLS-VPN-Panel-${RELEASE_TAG}.zip" -out dist
      - name: Publish release and tag exact tested commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CHANNEL: ${{ steps.version.outputs.channel }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          if [ "$RELEASE_CHANNEL" = preview ]; then set -- --prerelease --latest=false; else set -- --latest; fi
          gh release create "$RELEASE_TAG" "dist/DARKLS-VPN-Panel-${RELEASE_TAG}.zip" dist/panel-release.json dist/panel-release.sig --target "$GITHUB_SHA" --title "DARKLS VPN Panel ${RELEASE_TAG}" --notes-file dist/release-notes.md "$@"
