name: Test and release
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  release-plan:
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.diff.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if git diff --name-only "$BEFORE" "$GITHUB_SHA" -- release-version.txt | grep -q .; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          fi
  test:
    needs: release-plan
    with:
      build_release: ${{ needs.release-plan.outputs.publish == 'true' }}
    uses: ./.github/workflows/validate.yml
  release:
    needs: [test, release-plan]
    if: github.event_name == 'push' && needs.release-plan.outputs.publish == 'true'
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/release.yml
    secrets: inherit
